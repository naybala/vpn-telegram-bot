name: CI/CD — VPN Telegram Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1: Run Tests
  # ──────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✅ Run Jest Tests
        run: npm test

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to Production (only on push to main, after tests pass)
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "📂 Navigating to project directory..."
            cd /var/www/vpn-telegram-bot

            echo "⬇️ Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing production dependencies..."
            npm ci --omit=dev

            echo "🗄️ Running database migrations..."
            npm run migrate

            echo "🔄 Restarting bot with PM2..."
            pm2 restart vpn-bot --update-env || pm2 start index.js --name vpn-bot

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ Deployment complete!"
